# Shared environment for the team.
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
name: neuro_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Data processing / EEG
  - numpy
  - scipy
  - pandas
  - mne
  # EEG cleaning and spectral parameterization
  - mne-icalabel   # ICLabel: classifies ICA components (eye, muscle, brain, ...)
  - onnxruntime    # backend for mne-icalabel (avoids installing PyTorch)
  - meegkit        # Artifact Subspace Reconstruction (ASR) for movement bursts
  - fooof          # FOOOF/specparam: separates oscillatory peaks from the 1/f background
  # ML
  - scikit-learn
  # Plotting / notebooks
  - matplotlib
  - ipykernel
  - jupyter
  # LSL streaming: pylsl is pip-only; its wheel bundles the native liblsl
  - pip:
      - pylsl
